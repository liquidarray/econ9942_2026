{{ extends "global/Page.html" }}

{{ block title }}{{ endblock }}

{{ block styles }}
<style>
    .qsr-card {
        max-width: 900px;
        margin: 1rem auto;
        background: #ffffff;
        border: 1px solid #dee2e6;
        border-radius: 8px;
        padding: 1.75rem 2rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .qsr-question-stem {
        font-size: 1.15rem;
        line-height: 1.5;
        color: #111111;
        margin-bottom: 1.25rem;
    }

    .qsr-status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #f8f9fa;
        padding: 0.75rem 1rem;
        border-radius: 6px;
        border: 1px solid #dee2e6;
        margin-bottom: 1.25rem;
        font-weight: 600;
        color: #212529;
    }

    .qsr-tokens-left {
        color: #d9534f;
        font-weight: 700;
    }

    .qsr-tokens-left.zero {
        color: #198754;
    }

    /* CSS Grid Vertical Bar Chart + Spinners */
    #beliefs_grid {
        display: grid;
        grid-template-columns: 80px repeat(var(--num-bins, 1), 1fr);
        grid-template-rows: auto auto auto auto;
        column-gap: 15px;
        row-gap: 14px;
        align-items: end;
        background-color: #f4f5f7;
        padding: 28px 20px 20px 20px;
        border-radius: 8px;
        margin-bottom: 1.25rem;
        width: 100%;
    }

    .y-axis-labels {
        grid-row: 1;
        grid-column: 1;
        position: relative;
        height: 260px;
        border-right: 1px solid #ccc;
        text-align: right;
        font-size: 12px;
        line-height: 1.1;
        color: #555;
        box-sizing: border-box;
    }

    .y-axis-labels span {
        position: absolute;
        padding-right: 12px;
        right: 0;
        transform: translateY(-50%);
        white-space: nowrap;
    }

    .y-axis-labels span::after {
        content: "";
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 5px;
        height: 1px;
        background-color: #ccc;
    }

    .bin-column-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        height: 290px;
        width: 100%;
        position: relative;
    }

    .payoff-label {
        position: absolute;
        font-size: 13px;
        font-weight: 600;
        color: #333;
        line-height: 1.15;
        text-align: center;
        white-space: nowrap;
        transition: bottom 0.18s ease;
    }

    .bar-svg {
        height: 260px;
        width: 100%;
        max-width: 90px;
        background-color: transparent;
    }

    .bar-svg rect {
        transition: height 0.18s ease, y 0.18s ease;
    }

    /* Up/Down Vertical Spinner Widget */
    .quantity {
        position: relative;
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    input[type=number] {
        -moz-appearance: textfield;
    }

    .quantity input {
        width: 52px;
        height: 96px;
        line-height: 1.65;
        float: left;
        display: block;
        padding: 0;
        margin: 0;
        border: none;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.08);
        font-size: 1rem;
        border-radius: 4px;
        text-align: center;
    }

    .quantity-nav {
        float: left;
        position: relative;
        height: 64px;
    }

    .quantity-button {
        position: relative;
        cursor: pointer;
        border: 1px solid rgba(0, 0, 0, 0.12);
        width: 52px;
        text-align: center;
        color: #333;
        font-size: 14px;
        line-height: 1;
        padding: 0;
        background: #fafafa;
        transform: translateX(-100%);
        user-select: none;
    }

    .quantity-button:hover {
        background: #eaecef;
    }

    .quantity-button:active {
        background: #dee2e6;
    }

    .quantity-button.quantity-up {
        position: absolute;
        height: 48px;
        top: 0;
        border-radius: 4px 4px 0 0;
    }

    .quantity-button.quantity-down {
        position: absolute;
        top: 48px;
        height: 48px;
        border-radius: 0 0 4px 4px;
    }
</style>
{{ endblock }}

{{ block content }}
<div class="qsr-card">
    <div class="qsr-question-stem">
        {{ question_text }}
    </div>

    <div class="qsr-status-bar">
        <span id="directions_text">Allocate all {{ num_tokens }} tokens across the bins below</span>
        <span>Unallocated tokens: <span id="tokens_left" class="qsr-tokens-left">{{ num_tokens }}</span></span>
    </div>

    <div id="beliefs_grid"></div>

    <input type="hidden" name="{{ form_field_name }}" id="{{ form_field_name }}" />

    <div class="d-flex justify-content-end align-items-center mt-3">
        <button type="submit" id="btn_submit" class="btn btn-primary px-4" disabled>
            Submit
        </button>
    </div>
</div>
{{ endblock }}

{{ block scripts }}
<script>
    const binLabels = {{ bin_labels_json|safe }};
    const numBins = binLabels.length;
    const numTokens = {{ num_tokens }};
    const alpha = {{ alpha }};
    const beta = {{ beta }};
    const BAR_MAX_HEIGHT = 260;

    let response = new Array(numBins).fill(0);
    let scores = new Array(numBins).fill(0);
    let unallocatedTokens = numTokens;

    // Quadratic Scoring Rule: score_k = alpha + beta * (2 * p_k - sum_i(p_i^2))
    function scoringRule(index) {
        let ss = 0;
        for (let b = 0; b < numBins; b++) {
            ss += Math.pow(response[b] / numTokens, 2);
        }
        return alpha + beta * ((2 * response[index] / numTokens) - ss);
    }

    function responseChanged() {
        for (let i = 0; i < numBins; i++) {
            scores[i] = scoringRule(i);
            let percent = (scores[i] - (alpha - beta)) / (2 * beta);
            percent = Math.max(0, Math.min(1, percent));
            const barHeight = percent * BAR_MAX_HEIGHT;
            const barY = BAR_MAX_HEIGHT - barHeight;

            $(`#bar_fill_${i}`).attr('height', barHeight);
            $(`#bar_fill_${i}`).attr('y', barY);
            $(`#payoff_label_${i}`).html(`${scores[i].toFixed(2)}<br>points`);
            $(`#payoff_label_${i}`).css('bottom', (barHeight + 5) + 'px');
        }

        $('#tokens_left')
            .text(unallocatedTokens)
            .toggleClass('zero', unallocatedTokens === 0);

        $('#{{ form_field_name }}').val(JSON.stringify(response));

        if (unallocatedTokens === 0) {
            $('#btn_submit').prop('disabled', false);
            $('#directions_text').text('All tokens allocated — ready to submit');
        } else {
            $('#btn_submit').prop('disabled', true);
            $('#directions_text').text(`Allocate all ${numTokens} tokens before submitting`);
        }
    }

    document.addEventListener('DOMContentLoaded', function () {
        const $grid = $('#beliefs_grid');
        $grid.css('--num-bins', numBins);

        // 1. Add Y-Axis Labels in Column 1, Row 1
        $grid.append(`
            <div class="y-axis-labels">
                <span style="top: 0%;">${(alpha + beta).toFixed(0)}<br>pts</span>
                <span style="top: 25%;">${(alpha + beta / 2).toFixed(0)}<br>pts</span>
                <span style="top: 50%;">${alpha.toFixed(0)}<br>pts</span>
                <span style="top: 75%;">${(alpha - beta / 2).toFixed(0)}<br>pts</span>
                <span style="top: 100%;">${(alpha - beta).toFixed(0)}<br>pts</span>
            </div>
        `);

        // 2. Build each bin column (Bar + Token Count + Spinner + Category Label)
        for (let i = 0; i < numBins; i++) {
            const binNum = i;
            const colIdx = i + 2;

            // Row 1: SVG Bar & Payoff Label
            $grid.append(`
                <div class="bin-column-container" style="grid-row: 1; grid-column: ${colIdx};">
                    <div id="payoff_label_${binNum}" class="payoff-label">0.00<br>points</div>
                    <svg class="bar-svg" viewBox="0 0 100 ${BAR_MAX_HEIGHT}" preserveAspectRatio="none">
                        <line x1="0" y1="${BAR_MAX_HEIGHT}" x2="100" y2="${BAR_MAX_HEIGHT}" stroke="#ccc" stroke-width="1" />
                        <rect id="bar_fill_${binNum}" x="15" y="${BAR_MAX_HEIGHT}" width="70" height="0" rx="4" fill="#6495ED" />
                    </svg>
                </div>
            `);

            // Row 2: Token Count Display
            $grid.append(`
                <div style="grid-row: 2; grid-column: ${colIdx}; display: flex; justify-content: center; align-self: center; font-size: 14px; color: #333;">
                    <div><strong id="tokens_span_${binNum}">0</strong> tokens</div>
                </div>
            `);

            // Row 3: Up/Down Spinner Widget
            $grid.append(`
                <div class="quantity col d-flex justify-content-center" id="bin_${binNum}" style="grid-row: 3; grid-column: ${colIdx}; position: relative; align-self: center;">
                    <input type="number" min="0" max="${numTokens}" step="1" value="0" disabled="disabled">
                    <div class="quantity-nav">
                        <button class="quantity-button quantity-up btn" type="button" aria-label="Increase tokens">&#708;</button>
                        <button class="quantity-button quantity-down btn" type="button" aria-label="Decrease tokens">&#709;</button>
                    </div>
                </div>
            `);

            // Row 4: X-Axis Bin Label
            $grid.append(`
                <div style="grid-row: 4; grid-column: ${colIdx}; text-align: center; font-size: 18px; font-weight: 700; color: #333;">
                    ${binLabels[binNum]}
                </div>
            `);

            // Bind press-and-hold spinner behavior
            $(`#bin_${binNum}`).each(function () {
                const spinner = $(this),
                    input = spinner.find('input[type="number"]'),
                    btnUp = spinner.find('.quantity-up'),
                    btnDown = spinner.find('.quantity-down'),
                    min = parseFloat(input.attr('min'));

                let timeout, interval;

                function clearTimers() {
                    clearTimeout(timeout);
                    clearInterval(interval);
                }

                function incrementValue() {
                    const oldValue = parseFloat(input.val());
                    if (unallocatedTokens > 0) {
                        const newVal = oldValue + 1;
                        unallocatedTokens -= 1;
                        response[binNum] += 1;
                        $(`#tokens_span_${binNum}`).text(newVal);
                        input.val(newVal);
                        responseChanged();
                    }
                }

                function decrementValue() {
                    const oldValue = parseFloat(input.val());
                    if (oldValue > min) {
                        const newVal = oldValue - 1;
                        unallocatedTokens += 1;
                        response[binNum] -= 1;
                        $(`#tokens_span_${binNum}`).text(newVal);
                        input.val(newVal);
                        responseChanged();
                    }
                }

                btnUp.on('mousedown', function (e) {
                    e.preventDefault();
                    incrementValue();
                    timeout = setTimeout(() => { interval = setInterval(incrementValue, 50); }, 300);
                });

                btnDown.on('mousedown', function (e) {
                    e.preventDefault();
                    decrementValue();
                    timeout = setTimeout(() => { interval = setInterval(decrementValue, 50); }, 300);
                });

                btnUp.on('mouseup mouseleave touchend', clearTimers);
                btnDown.on('mouseup mouseleave touchend', clearTimers);
            });
        }

        // Initial render with 0 tokens allocated
        responseChanged();
    });
</script>
{{ endblock }}
